<div class="tr-at-container">
    <div class="tr-at-header">
        <span class="tr-at-title">TRANSLATOR / TRADUCTOR</span>
        <button class="tr-at-close" onclick="togglePopup(event, 'popup-translate')">×</button>
    </div>

    <div class="tr-at-card">
        <div class="tr-at-lang-row">
            <span class="tr-at-orange">ESPAÑOL > INGLÉS</span>
            <button class="tr-at-reset" onclick="document.getElementById('in-es').value=''; document.getElementById('out-es').innerText='' ">🔄</button>
        </div>
        <div style="position: relative;">
            <textarea id="in-es" class="tr-at-input" placeholder="Escribe..." 
                onkeydown="if(event.key==='Enter'){ event.preventDefault(); doMigoTrans('es', 'en'); }"></textarea>
            <button class="tr-at-inline-send" onclick="doMigoTrans('es', 'en')">➔</button>
        </div>
        <div class="tr-at-result-box">
            <span class="tr-at-label-green">RESULT</span>
            <div id="out-es" class="tr-at-output"></div>
        </div>
    </div>

    <div class="tr-at-card">
        <div class="tr-at-lang-row">
            <span class="tr-at-orange">ENGLISH > SPANISH</span>
            <button class="tr-at-reset" onclick="document.getElementById('in-en').value=''; document.getElementById('out-en').innerText='' ">🔄</button>
        </div>
        <div style="position: relative;">
            <textarea id="in-en" class="tr-at-input" placeholder="Type..." 
                onkeydown="if(event.key==='Enter'){ event.preventDefault(); doMigoTrans('en', 'es'); }"></textarea>
            <button class="tr-at-inline-send" onclick="doMigoTrans('en', 'es')">➔</button>
        </div>
        <div class="tr-at-result-box">
            <span class="tr-at-label-green">RESULTADO</span>
            <div id="out-en" class="tr-at-output"></div>
        </div>
    </div>
</div>

<script>
    async function doMigoTrans(from, to) {
        const input = document.getElementById(from === 'es' ? 'in-es' : 'in-en');
        const output = document.getElementById(from === 'es' ? 'out-es' : 'out-en');
        const text = input.value.trim();
        
        if (!text) return;
        output.innerText = "...";

        try {
            const r = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${from}|${to}`);
            const d = await r.json();
            output.innerText = d.responseData.translatedText || "Error";
        } catch (e) {
            output.innerText = "Error de red";
        }
    }
</script>
