<div class="tr-at-container">
    <div class="tr-at-header">
        <span class="tr-at-title">TRANSLATOR / TRADUCTOR</span>
        <button class="tr-at-close" onclick="togglePopup(event, 'popup-translate')">×</button>
    </div>

    <div class="tr-at-card">
        <div class="tr-at-lang-row">
            <span class="tr-at-orange">ESPAÑOL > INGLÉS</span>
            <button class="tr-at-reset" onclick="document.getElementById('in-es-at').value=''; document.getElementById('out-es-at').innerText='' ">🔄</button>
        </div>
        
        <div class="tr-at-input-wrapper" style="position: relative; display: flex; align-items: center;">
            <textarea id="in-es-at" class="tr-at-input" placeholder="Escribe..." 
                onkeydown="if(event.key==='Enter'){ event.preventDefault(); migoTranslate('es', 'en'); }"></textarea>
            <button class="tr-at-inline-send" onclick="migoTranslate('es', 'en')" style="position: absolute; right: 10px; background: #48bb78; color: white; border: none; width: 32px; height: 32px; border-radius: 8px; cursor: pointer;">➔</button>
        </div>
        
        <div class="tr-at-result-box">
            <span class="tr-at-label-green">RESULT</span>
            <div id="out-es-at" class="tr-at-output" style="min-height: 20px; font-weight: 600;"></div>
            <button class="tr-at-copy" onclick="const t = document.getElementById('out-es-at').innerText; if(t) navigator.clipboard.writeText(t);">📋</button>
        </div>
    </div>

    <div class="tr-at-card">
        <div class="tr-at-lang-row">
            <span class="tr-at-orange">ENGLISH > SPANISH</span>
            <button class="tr-at-reset" onclick="document.getElementById('in-en-at').value=''; document.getElementById('out-en-at').innerText='' ">🔄</button>
        </div>

        <div class="tr-at-input-wrapper" style="position: relative; display: flex; align-items: center;">
            <textarea id="in-en-at" class="tr-at-input" placeholder="Type..." 
                onkeydown="if(event.key==='Enter'){ event.preventDefault(); migoTranslate('en', 'es'); }"></textarea>
            <button class="tr-at-inline-send" onclick="migoTranslate('en', 'es')" style="position: absolute; right: 10px; background: #48bb78; color: white; border: none; width: 32px; height: 32px; border-radius: 8px; cursor: pointer;">➔</button>
        </div>
        
        <div class="tr-at-result-box">
            <span class="tr-at-label-green">RESULTADO</span>
            <div id="out-en-at" class="tr-at-output" style="min-height: 20px; font-weight: 600;"></div>
            <button class="tr-at-copy" onclick="const t = document.getElementById('out-en-at').innerText; if(t) navigator.clipboard.writeText(t);">📋</button>
        </div>
    </div>
</div>

<script>
    async function migoTranslate(from, to) {
        const inputId = (from === 'es') ? 'in-es-at' : 'in-en-at';
        const outputId = (from === 'es') ? 'out-es-at' : 'out-en-at';
        
        const text = document.getElementById(inputId).value.trim();
        const output = document.getElementById(outputId);

        if (!text) return;
        output.innerText = "...";

        try {
            // Usamos un proxy para evitar problemas de CORS si la API directa falla
            const response = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${from}|${to}`);
            const data = await response.json();
            
            if (data.responseData) {
                output.innerText = data.responseData.translatedText;
            } else {
                output.innerText = "Error en traducción";
            }
        } catch (error) {
            output.innerText = "Error de conexión";
            console.error("Migo Error:", error);
        }
    }
</script>
