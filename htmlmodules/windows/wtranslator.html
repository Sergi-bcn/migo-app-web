<div class="translator-premium-card">
    <div class="trans-header-main">
        <span>TRANSLATOR / TRADUCTOR</span>
        <span class="close-x-red" onclick="this.parentElement.parentElement.classList.remove('active')">×</span>
    </div>
    
    <div class="trans-unit-box">
        <p class="label-orange">ESPAÑOL > INGLÉS</p>
        <div class="input-zone-styled">
            <textarea id="translate-input" placeholder="Escribe aquí tu frase..."></textarea>
        </div>
        
        <div class="result-zone-styled">
            <div id="translate-result" style="color: #718096; font-size: 15px;">El resultado aparecerá aquí...</div>
        </div>

        <div class="actions-row">
            <button class="icon-btn-grey" onclick="copyTranslation()">📋</button>
            <button class="green-arrow-btn" onclick="executeTranslation()">➔</button>
        </div>
    </div>
</div>
