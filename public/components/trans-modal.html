<div x-show="popups.trans" x-cloak class="popup-base" style="top: 6rem; right: 2rem; width: 320px;" @click.away="popups.trans = false">
    <h4 class="text-[10px] font-extrabold text-gray-400 uppercase mb-4 tracking-widest text-center">Traductor Instantáneo</h4>
    
    <div class="trans-box">
        <span class="trans-label">Español</span>
        <textarea class="trans-text" placeholder="Escribe para traducir..."></textarea>
    </div>

    <div class="flex justify-center my-2 text-gray-300">
        <i data-lucide="arrow-down-up" class="w-4 h-4"></i>
    </div>

    <div class="trans-box">
        <span class="trans-label">English (AI)</span>
        <textarea class="trans-text" readonly placeholder="Traducción automática..." style="color: #ff9800;"></textarea>
    </div>
</div>
