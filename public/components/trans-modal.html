<div x-show="popups.trans" x-cloak class="absolute top-24 right-6 w-[340px] bg-white rounded-[40px] popup-card z-[100] p-8 popup-arrow-top" @click.away="popups.trans = false">
    <h4 class="text-[10px] font-bold text-gray-400 uppercase mb-6 tracking-widest text-center">Traductor Instantáneo</h4>
    
    <div class="space-y-6">
        <div class="relative bg-gray-50/80 rounded-[25px] p-5 border border-gray-100">
            <p class="text-[10px] font-black text-[#ff9800] uppercase mb-2">Español > Inglés</p>
            <textarea 
                placeholder="Escribe aquí..." 
                @keydown.enter.prevent="translate('es')" 
                class="w-full bg-transparent text-sm font-bold outline-none resize-none h-16 text-gray-700">
            </textarea>
            <button @click="translate('es')" class="absolute right-4 bottom-4 w-9 h-9 bg-[#ff9800] text-white rounded-full flex items-center justify-center shadow-lg hover:scale-110 transition-transform">
                <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>
        </div>

        <div class="relative bg-gray-50/80 rounded-[25px] p-5 border border-gray-100">
            <p class="text-[10px] font-black text-[#4caf50] uppercase mb-2">English > Spanish</p>
            <textarea 
                placeholder="Type here..." 
                @keydown.enter.prevent="translate('en')" 
                class="w-full bg-transparent text-sm font-bold outline-none resize-none h-16 text-gray-700">
            </textarea>
            <button @click="translate('en')" class="absolute right-4 bottom-4 w-9 h-9 bg-[#4caf50] text-white rounded-full flex items-center justify-center shadow-lg hover:scale-110 transition-transform">
                <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>
        </div>
    </div>
</div>
