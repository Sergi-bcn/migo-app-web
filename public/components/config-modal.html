<div x-show="popups.config" x-cloak class="config-popup" @click.away="popups.config = false">
    <div class="config-section">
        <p class="config-title">Nivel de Rigor</p>
        <div class="config-grid">
            <button @click="config.rigor = 'Strict'; unblock()" :class="config.rigor === 'Strict' ? 'active' : ''" class="mode-card">
                <i data-lucide="shield-check" class="w-5 h-5 mb-1"></i>
                <span>Strict</span>
            </button>
            <button @click="config.rigor = 'Normal'; unblock()" :class="config.rigor === 'Normal' ? 'active' : ''" class="mode-card">
                <i data-lucide="zap" class="w-5 h-5 mb-1"></i>
                <span>Normal</span>
            </button>
        </div>
    </div>
    
    <div class="config-section mt-4">
        <p class="config-title">Estilo de Chat</p>
        <div class="config-grid">
            <button @click="config.modo = 'Colloquial'" :class="config.modo === 'Colloquial' ? 'active' : ''" class="mode-card">
                <i data-lucide="message-circle" class="w-5 h-5 mb-1"></i>
                <span>Coloquial</span>
            </button>
            <button @click="config.modo = 'Formal'" :class="config.modo === 'Formal' ? 'active' : ''" class="mode-card">
                <i data-lucide="briefcase" class="w-5 h-5 mb-1"></i>
                <span>Formal</span>
            </button>
        </div>
    </div>
</div>
