<div x-show="popups.config" x-cloak class="config-popup">
    <div class="flex justify-between items-center mb-4">
        <h4 class="text-[10px] font-extrabold text-gray-400 uppercase tracking-widest">Modo</h4>
        <button @click="popups.config = false" class="text-gray-300 hover:text-gray-500 transition-colors">
            <i data-lucide="x" class="w-4 h-4"></i>
        </button>
    </div>
    <div class="space-y-4">
        <div>
            <p class="text-[9px] font-bold text-gray-400 uppercase mb-2">Rigor</p>
            <div class="grid grid-cols-2 gap-2">
                <button @click="config.rigor = 'Strict'; unblock()" :class="config.rigor === 'Strict' ? 'bg-[#ff9800] text-white' : 'bg-gray-50'" class="p-2 rounded-xl text-xs font-bold">Strict</button>
                <button @click="config.rigor = 'Normal'; unblock()" :class="config.rigor === 'Normal' ? 'bg-[#ff9800] text-white' : 'bg-gray-50'" class="p-2 rounded-xl text-xs font-bold">Normal</button>
            </div>
        </div>
        <div>
            <p class="text-[9px] font-bold text-gray-400 uppercase mb-2">Estilo</p>
            <div class="grid grid-cols-2 gap-2">
                <button @click="config.modo = 'Colloquial'" :class="config.modo === 'Colloquial' ? 'bg-[#ff9800] text-white' : 'bg-gray-50'" class="p-2 rounded-xl text-xs font-bold">Coloquial</button>
                <button @click="config.modo = 'Formal'" :class="config.modo === 'Formal' ? 'bg-[#ff9800] text-white' : 'bg-gray-50'" class="p-2 rounded-xl text-xs font-bold">Formal</button>
            </div>
        </div>
    </div>
</div>
