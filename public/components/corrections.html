<section class="sidebar-errors">
    <header class="error-header">
        <div class="status-light" :class="isBlocked ? 'bg-red-500 animate-pulse' : 'bg-[#4caf50]'"></div>
        <h2 x-text="isBlocked ? 'Attention' : 'Corrections'"></h2>
    </header>
    <div class="correction-content" x-html="correction || 'Waiting for errors...'"></div>
    <template x-if="isBlocked">
        <button @click="unblock()" class="m-6 p-4 bg-red-500 text-white rounded-2xl font-bold text-[10px] uppercase tracking-widest border-none cursor-pointer shadow-lg">Unblock</button>
    </template>
</section>
