<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Migo - App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-[#f0f2f5] h-screen flex overflow-hidden font-sans" x-data="migoApp()" x-init="init()">
    <nav class="w-16 bg-[#ff9800] h-full flex flex-col items-center py-8 flex-shrink-0 relative z-[200]">
        <div class="flex flex-col gap-6 items-center w-full">
            <button class="nav-icon"><i data-lucide="home"></i></button>
            <button class="nav-icon"><i data-lucide="book-open"></i></button>
        </div>
        <button @click="popups.user = !popups.user" class="profile-dot">S</button>
    </nav>

    <main class="flex-1 flex p-6 gap-6 overflow-hidden relative">
        <section class="sidebar-corrections" :class="isBlocked ? 'ring-2 ring-red-100' : ''">
            <header class="p-6 border-b border-gray-50 flex items-center gap-3">
                <div class="status-dot" :class="isBlocked ? 'bg-red-500' : 'bg-[#4caf50]'"></div>
                <h2 class="font-extrabold text-[#ff9800] text-[10px] tracking-widest uppercase" x-text="isBlocked ? 'Attention' : 'Corrections'"></h2>
            </header>
            <div class="sidebar-content" x-html="correction || 'Waiting for errors...'"></div>
        </section>

        <section class="main-chat-area">
            <header class="p-7 flex justify-between items-center relative z-50">
                <h1 class="text-3xl font-extrabold text-gray-800 tracking-tight">Migo<span class="text-[#ff9800]">.</span></h1>
                <div class="header-tools">
                    <button @click="popups.config = !popups.config" class="tool-btn"><i data-lucide="settings"></i></button>
                    <button @click="popups.trans = !popups.trans" class="tool-btn"><i data-lucide="languages"></i></button>
                </div>
            </header>
            <div id="chat-container" class="messages-container">
                <template x-for="msg in messages">
                    <div :class="msg.role === 'user' ? 'msg-user' : 'msg-migo'" x-text="msg.text"></div>
                </template>
            </div>
            <div class="p-8 flex gap-4 items-center">
                <textarea x-model="userInput" @keydown.enter.prevent="send()" :disabled="isBlocked || loading"></textarea>
                <button @click="send()" class="btn-send"><i data-lucide="send"></i></button>
            </div>
            <div id="config-modal-container"></div>
            <div id="trans-modal-container"></div>
        </section>
    </main>
    <script src="/js/app.js"></script>
</body>
</html>
