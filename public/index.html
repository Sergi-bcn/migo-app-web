
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Migo - English Tutor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { migo: { orange: '#ff9800', green: '#4caf50', bg: '#f0f2f5' } },
                    fontFamily: { sans: ['Quicksand', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        [x-cloak] { display: none !important; }
        .chat-scroll::-webkit-scrollbar { width: 4px; }
        .chat-scroll::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
    </style>
</head>
<body class="bg-migo-bg h-screen flex overflow-hidden font-sans" x-data="migoApp()" x-init="lucide.createIcons()">

    <nav class="w-20 bg-migo-orange h-full flex flex-col items-center py-8 flex-shrink-0">
        <div class="flex flex-col gap-6">
            <button class="w-12 h-12 bg-white/20 rounded-2xl flex items-center justify-center text-white hover:bg-white/30 transition"><i data-lucide="home"></i></button>
            <button class="w-12 h-12 bg-white/20 rounded-2xl flex items-center justify-center text-white hover:bg-white/30 transition"><i data-lucide="book-open"></i></button>
        </div>
        <button @click="togglePopup('user')" class="mt-auto w-12 h-12 bg-white rounded-full flex items-center justify-center text-migo-orange font-black text-xl shadow-lg hover:scale-110 transition">S</button>
    </nav>

    <main class="flex-1 flex p-6 gap-6 overflow-hidden">
        
        <section class="w-full max-w-[360px] bg-white rounded-[35px] shadow-sm flex flex-col overflow-hidden border border-gray-100">
            <header class="p-6 border-b border-gray-50 flex items-center gap-3">
                <div class="w-2.5 h-2.5 bg-red-500 rounded-full animate-pulse"></div>
                <h2 class="font-extrabold text-migo-orange text-sm tracking-widest uppercase">Corrections</h2>
            </header>
            <div class="flex-1 p-6 overflow-y-auto chat-scroll text-gray-700 text-sm">
                <template x-if="correction">
                    <div class="bg-orange-50 p-4 rounded-2xl border border-orange-100" x-html="correction"></div>
                </template>
                <template x-if="!correction">
                    <p class="italic opacity-50">Awaiting your first sentence...</p>
                </template>
            </div>
        </section>

        <section class="flex-1 bg-white rounded-[35px] shadow-sm flex flex-col relative overflow-hidden">
            <header class="p-7 flex justify-between items-center">
                <h1 class="text-3xl font-extrabold text-gray-800">Migo<span class="text-migo-orange">.</span></h1>
                
                <div class="flex gap-6 text-gray-400">
                    <button @click="togglePopup('config')" class="hover:text-migo-orange transition hover:rotate-45"><i data-lucide="settings"></i></button>
                    <button @click="togglePopup('trans')" class="hover:text-migo-orange transition hover:scale-110"><i data-lucide="languages"></i></button>
                </div>
            </header>

            <div class="flex-1 mx-6 bg-gray-50/50 rounded-[30px] p-6 overflow-y-auto flex flex-col gap-4 chat-scroll" id="chat-box">
                <template x-for="msg in messages" :key="msg.id">
                    <div :class="msg.role === 'migo' ? 'self-start bg-migo-orange text-white rounded-bl-none' : 'self-end bg-white text-gray-700 shadow-sm rounded-br-none'" 
                         class="max-w-[80%] p-4 px-6 rounded-[22px] font-semibold text-[15px]" x-text="msg.text"></div>
                </template>
            </div>

            <div class="p-7 flex gap-4 items-end">
                <div class="flex-1 bg-gray-50 rounded-[22px] px-6 py-1 border-2 border-transparent focus-within:border-migo-orange/20 transition">
                    <textarea x-model="userInput" @keydown.enter.prevent="send()" class="w-full outline-none py-3 text-[15px] h-12 bg-transparent" placeholder="Write in English..."></textarea>
                </div>
                <button @click="send()" class="w-14 h-12 bg-migo-green text-white rounded-[18px] flex items-center justify-center text-2xl shadow-lg hover:brightness-105 transition">➜</button>
            </div>

            <div x-show="popups.config" x-cloak @click.away="popups.config = false" x-transition class="absolute top-24 right-20 w-72 bg-white rounded-[30px] shadow-2xl p-7 z-50 border border-gray-100">
                <h3 class="font-bold text-lg mb-4 text-gray-800">Conversation Mode</h3>
                <button class="w-full text-left p-4 rounded-2xl bg-migo-green text-white font-bold mb-3 flex justify-between items-center">Strict 🔒</button>
                <button class="w-full text-left p-4 rounded-2xl bg-gray-50 text-gray-500 font-bold hover:bg-gray-100 transition">Relaxed 🔓</button>
            </div>

            <div x-show="popups.trans" x-cloak @click.away="popups.trans = false" x-transition class="absolute top-24 right-8 w-80 bg-white rounded-[30px] shadow-2xl p-7 z-50 border border-gray-100">
                <h3 class="font-bold text-lg mb-4 text-gray-800">Quick Translator</h3>
                <textarea x-model="transInput" class="w-full bg-gray-50 border-none rounded-2xl p-4 text-sm mb-3 outline-none h-24" placeholder="Type in Spanish..."></textarea>
                <div class="bg-orange-50/50 p-4 rounded-2xl text-sm min-h-[50px] mb-4 text-gray-700 font-medium border border-orange-100" x-text="transOutput || 'Translation will appear here...'"></div>
                <button @click="translate()" class="w-full bg-migo-orange text-white py-4 rounded-2xl font-extrabold shadow-lg hover:brightness-105 transition">Translate</button>
            </div>

            <div x-show="popups.user" x-cloak @click.away="popups.user = false" x-transition class="absolute bottom-28 left-4 w-64 bg-white rounded-[30px] shadow-2xl p-6 border border-gray-100 z-50">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 bg-orange-100 rounded-full flex items-center justify-center text-migo-orange font-black text-xl">S</div>
                    <div>
                        <h4 class="font-extrabold text-gray-800">Sergi Pérez</h4>
                        <p class="text-[10px] text-migo-orange font-bold uppercase tracking-widest">Student</p>
                    </div>
                </div>
            </div>

        </section>
    </main>

    <script>
        function migoApp() {
            return {
                userInput: '', transInput: '', transOutput: '', correction: '',
                popups: { config: false, trans: false, user: false },
                messages: [{ id: 1, role: 'migo', text: '¡Hola Sergi! Ya he recuperado los iconos y las ventanas. ¿Probamos el traductor?' }],
                
                togglePopup(key) {
                    Object.keys(this.popups).forEach(k => { if(k !== key) this.popups[k] = false; });
                    this.popups[key] = !this.popups[key];
                },

                async send() {
                    if (!this.userInput.trim()) return;
                    const text = this.userInput;
                    this.messages.push({ id: Date.now(), role: 'user', text: text });
                    this.userInput = '';
                    this.scrollChat();

                    try {
                        const res = await fetch('/api/chat', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ message: text })
                        });
                        const data = await res.json();
                        this.messages.push({ id: Date.now()+1, role: 'migo', text: data.reply });
                        this.correction = data.correction;
                    } catch (e) { console.error(e); }
                    this.scrollChat();
                },

                scrollChat() {
                    setTimeout(() => {
                        const box = document.getElementById('chat-box');
                        box.scrollTo({ top: box.scrollHeight, behavior: 'smooth' });
                    }, 50);
                },

                async translate() {
                    if(!this.transInput) return;
                    this.transOutput = "Translating...";
                    try {
                        const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=es&tl=en&dt=t&q=${encodeURI(this.transInput)}`);
                        const data = await res.json();
                        this.transOutput = data[0][0][0];
                    } catch (e) { this.transOutput = "Error."; }
                }
            }
        }
    </script>
</body>
</html>
