<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Migo - App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: { extend: { colors: { migo: { orange: '#ff9800', green: '#4caf50', bg: '#f0f2f5' } }, fontFamily: { sans: ['Quicksand', 'sans-serif'] } } }
        }
    </script>
    <style>
        [x-cloak] { display: none !important; }
        .popup-card { border: 1px solid #f1f5f9; box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1); }
        .popup-arrow-user::before { content: ''; position: absolute; left: -8px; bottom: 30px; transform: rotate(45deg); width: 16px; height: 16px; background: white; border-left: 1px solid #f1f5f9; border-bottom: 1px solid #f1f5f9; }
        .scroll-smooth-custom { scroll-behavior: smooth; }
    </style>
</head>
<body class="bg-migo-bg h-screen flex overflow-hidden font-sans" x-data="migoApp()" x-init="lucide.createIcons(); $watch('messages', () => scrollToBottom())">
    
    <nav class="w-20 bg-migo-orange h-full flex flex-col items-center py-8 flex-shrink-0 relative z-[200]">
        <div class="flex flex-col gap-6">
            <button class="w-12 h-12 bg-white/20 rounded-2xl flex items-center justify-center text-white"><i data-lucide="home"></i></button>
        </div>
        <button @click="popups.user = !popups.user" class="mt-auto w-12 h-12 bg-white rounded-full flex items-center justify-center text-migo-orange font-black text-xl shadow-lg relative z-[210]">S</button>
    </nav>

    <main class="flex-1 flex p-6 gap-6 overflow-hidden relative">
        <section class="w-full max-w-[320px] bg-white rounded-[40px] shadow-sm flex flex-col border border-gray-100 overflow-hidden">
            <header class="p-6 border-b border-gray-50 flex items-center gap-3">
                <div class="w-2.5 h-2.5 bg-red-500 rounded-full animate-pulse"></div>
                <h2 class="font-extrabold text-migo-orange text-[10px] tracking-widest uppercase">Ayuda Migo</h2>
            </header>
            <div class="flex-1 p-6 text-gray-700 text-sm italic" x-html="correction || 'Escribe en inglés y Migo te ayudará con tus errores aquí...'"></div>
        </section>

        <section class="flex-1 bg-white rounded-[40px] shadow-sm flex flex-col relative border border-gray-100 z-20 overflow-hidden">
            <header class="p-7 flex justify-between items-center relative z-50">
                <h1 class="text-3xl font-extrabold text-gray-800 tracking-tight">Migo<span class="text-migo-orange">.</span></h1>
                <div class="flex bg-gray-100 p-1.5 rounded-full relative transition-all duration-300">
                    <button @click="popups.trans = !popups.trans" class="w-10 h-10 flex items-center justify-center rounded-full transition" :class="popups.trans ? 'bg-white shadow-sm text-migo-orange' : 'text-gray-400 hover:text-gray-600'"><i data-lucide="languages" class="w-5 h-5"></i></button>
                </div>
            </header>

            <div id="chat-container" class="flex-1 mx-6 bg-gray-50/50 rounded-[35px] p-8 overflow-y-auto flex flex-col gap-5 scroll-smooth-custom">
                <template x-for="msg in messages">
                    <div :class="msg.role === 'user' ? 'bg-white text-gray-700' : 'bg-migo-orange text-white'" 
                         class="max-w-[85%] self-start p-5 px-7 rounded-[28px] rounded-bl-none font-semibold text-[15px]" x-text="msg.text"></div>
                </template>
                <div x-show="loading" class="self-start text-gray-400 text-xs font-bold animate-pulse px-7">Migo está pensando...</div>
            </div>

            <div class="p-8 flex gap-4 items-center">
                <div class="flex-1 bg-gray-50 rounded-[25px] px-6 py-2 border border-transparent focus-within:border-migo-orange/20">
                    <textarea x-model="userInput" @keydown.enter.prevent="send()" class="w-full outline-none py-3 text-[15px] h-12 bg-transparent text-gray-700 resize-none" placeholder="Habla con Migo en inglés..."></textarea>
                </div>
                <button @click="send()" :disabled="loading" class="w-14 h-14 bg-migo-green text-white rounded-[20px] flex items-center justify-center shadow-lg hover:brightness-105 disabled:opacity-50"><i data-lucide="arrow-right" class="w-6 h-6"></i></button>
            </div>

            <div x-show="popups.trans" x-cloak class="absolute top-24 right-6 w-[340px] bg-white rounded-[30px] popup-card z-[100] p-6 flex flex-col h-[400px]">
                <div class="flex justify-between items-center mb-4 flex-shrink-0"><h4 class="text-[10px] font-extrabold text-gray-400 tracking-widest uppercase">Traductor Rápido</h4><button @click="popups.trans = false" class="text-red-400"><i data-lucide="x" class="w-5 h-5"></i></button></div>
                <div class="flex-1 flex flex-col gap-4 overflow-hidden">
                    <div class="flex flex-col h-1/2 relative">
                        <textarea x-model="transTexts.es" @input.debounce.500ms="runTranslation('es')" class="w-full h-full bg-green-50/30 border border-green-100 rounded-xl p-3 text-sm outline-none resize-none" placeholder="Escribe en español..."></textarea>
                        <div class="mt-1 p-2 bg-gray-50 rounded-lg text-[10px] text-gray-700 font-bold" x-text="results.es || 'TRADUCCIÓN...'"></div>
                    </div>
                    <div class="flex flex-col h-1/2 relative">
                        <textarea x-model="transTexts.en" @input.debounce.500ms="runTranslation('en')" class="w-full h-full bg-green-50/30 border border-green-100 rounded-xl p-3 text-sm outline-none resize-none" placeholder="Write in English..."></textarea>
                        <div class="mt-1 p-2 bg-gray-50 rounded-lg text-[10px] text-gray-700 font-bold" x-text="results.en || 'TRANSLATION...'"></div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        function migoApp() {
            return {
                userInput: '', correction: '', loading: false,
                popups: { trans: false, user: false },
                config: { modo: 'Coloquial' },
                transTexts: { es: '', en: '' },
                results: { es: '', en: '' },
                messages: [{ role: 'migo', text: 'Hello! Soy Migo. Estoy aquí para ayudarte a practicar inglés de forma fácil. ¿Cómo estás?' }],
                
                async send() {
                    if (!this.userInput.trim() || this.loading) return;
                    const text = this.userInput;
                    this.messages.push({ role: 'user', text: text });
                    this.userInput = '';
                    this.loading = true;

                    try {
                        const response = await fetch('/api/chat', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                modo: this.config.modo,
                                messages: this.messages.map(m => ({ role: m.role, content: m.text }))
                            })
                        });

                        const data = await response.json();
                        const result = JSON.parse(data.choices[0].message.content);
                        this.messages.push({ role: 'migo', text: result.reply });
                        if (result.fix) this.correction = result.fix;
                    } catch (e) {
                        this.messages.push({ role: 'migo', text: 'Lo siento, Migo está teniendo un problema técnico. Inténtalo de nuevo.' });
                    } finally {
                        this.loading = false;
                        lucide.createIcons();
                    }
                },
                async runTranslation(lang) {
                    const text = (lang === 'es' ? this.transTexts.es : this.transTexts.en).trim();
                    if (!text) return;
                    const [s, t] = lang === 'es' ? ['es', 'en'] : ['en', 'es'];
                    const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${s}&tl=${t}&dt=t&q=${encodeURIComponent(text)}`);
                    const data = await res.json();
                    lang === 'es' ? this.results.es = data[0][0][0] : this.results.en = data[0][0][0];
                },
                scrollToBottom() {
                    const c = document.getElementById('chat-container');
                    if (c) setTimeout(() => { c.scrollTop = c.scrollHeight; }, 50);
                }
            }
        }
    </script>
</body>
</html>
