<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Migo - Full Modular</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/navbar.css">
    <link rel="stylesheet" href="/css/corrections.css">
    <link rel="stylesheet" href="/css/chat.css">
    <link rel="stylesheet" href="/css/popup-user.css">
    <link rel="stylesheet" href="/css/popup-trans.css">
    <link rel="stylesheet" href="/css/popup-config.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
        body { background: #f0f2f5; font-family: 'Quicksand', sans-serif; margin: 0; overflow: hidden; width: 100vw; }
        main { width: 100% !important; max-width: none !important; flex-grow: 1 !important; }
    </style>
</head>
<body x-data="migoApp()" x-init="init()" class="h-screen flex w-screen">
    <div id="mw-navbar"></div>
    <main class="flex-1 flex p-6 pr-6 gap-8 overflow-hidden relative h-full">
        <div id="mw-corrections"></div>
        <div id="mw-chat" class="flex-1 h-full flex flex-col"></div>
        
        <div id="mw-popup-config"></div>
        <div id="mw-popup-trans"></div>
        <div id="mw-popup-user"></div>
    </main>
    <script src="/js/app.js"></script>
</body>
</html>
