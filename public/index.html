<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Migo - App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: { extend: { colors: { migo: { orange: '#ff9800', green: '#4caf50', bg: '#f0f2f5' } }, fontFamily: { sans: ['Quicksand', 'sans-serif'] } } }
        }
    </script>
    <style>
        [x-cloak] { display: none !important; }
        .popup-card { border: 1px solid #f1f5f9; box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1); background: white; width: 320px; }
        .btn-mode { @apply w-full flex items-center gap-3 p-3 rounded-xl text-sm font-bold transition-all mb-2; border: 1px solid #f0f0f0; }
        .btn-active { @apply bg-migo-green text-white border-migo-green shadow-md; }
        .trans-box { @apply bg-[#f8fafc] border border-[#e2e8f0] rounded-2xl p-4 mb-4; }
        .trans-label { @apply text-[10px] font-black uppercase tracking-tighter mb-2; }
    </style>
</head>
<body class="bg-migo-bg h-screen flex overflow-hidden font-sans" x-data="migoApp()" x-init="lucide.createIcons(); $watch('messages', () => scrollToBottom())">
    
    <nav class="w-16 bg-migo-orange h-full flex flex-col items-center py-8 flex-shrink-0 relative z-[200]">
        <div class="flex flex-col gap-6 items-center w-full">
            <button class="w-11 h-11 bg-white/20 rounded-2xl flex items-center justify-center text-white"><i data-lucide="home"></i></button>
            <button class="w-11 h-11 bg-white/20 rounded-2xl flex items-center justify-center text-white"><i data-lucide="book-open"></i></button>
        </div>
        <button @click="popups.user = !popups.user" class="mt-auto w-11 h-11 bg-white rounded-full flex items-center justify-center text-migo-orange font-black shadow-lg">S</button>
    </nav>

    <main class="flex-1 flex p-6 gap-6 overflow-hidden relative">
        <section class="w-full max-w-[340px] bg-white rounded-[40px] shadow-sm flex flex-col border border-gray-100 overflow-hidden">
            <header class="p-6 border-b border-gray-50 flex items-center gap-3">
                <div class="w-2.5 h-2.5 bg-red-500 rounded-full animate-pulse"></div>
                <h2 class="font-extrabold text-migo-orange text-[10px] tracking-widest uppercase">Corrections</h2>
            </header>
            <div class="flex-1 p-6 text-gray-400 italic" x-text="correction || 'Waiting for errors...'"></div>
        </section>

        <section class="flex-1 bg-white rounded-[40px] shadow-sm flex flex-col relative border border-gray-100 overflow-hidden">
            <header class="p-7 flex justify-between items-center relative z-50">
                <h1 class="text-3xl font-extrabold text-gray-800 tracking-tight">Migo<span class="text-migo-orange">.</span></h1>
                <div class="flex bg-gray-100 p-1.5 rounded-full">
                    <button @click="popups.config = !popups.config" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-white transition ml-2"><i data-lucide="settings" class="w-5 h-5"></i></button>
                    <button @click="popups.trans = !popups.trans" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-white transition ml-2"><i data-lucide="languages" class="w-5 h-5"></i></button>
                </div>
            </header>

            <div id="chat-container" class="flex-1 mx-6 bg-gray-50/50 rounded-[35px] p-8 overflow-y-auto flex flex-col gap-5">
                <template x-for="msg in messages">
                    <div :class="msg.role === 'user' ? 'bg-white text-gray-700 ml-auto' : 'bg-migo-orange text-white'" class="max-w-[85%] p-5 px-7 rounded-[28px] font-semibold text-[15px] shadow-sm" x-text="msg.text"></div>
                </template>
            </div>

            <div class="p-8 flex gap-4 items-center">
                <textarea x-model="userInput" @keydown.enter.prevent="send()" :disabled="loading" class="flex-1 bg-gray-50 border-none rounded-[25px] p-4 h-14 resize-none outline-none" placeholder="Type here..."></textarea>
                <button @click="send()" :disabled="loading" class="w-14 h-14 bg-migo-green text-white rounded-2xl flex items-center justify-center shadow-lg"><i data-lucide="send"></i></button>
            </div>

            <div x-show="popups.config" x-cloak class="absolute top-24 right-14 bg-white rounded-[30px] popup-card z-[100] p-6 border border-gray-100" @click.away="popups.config = false">
                <h4 class="text-[10px] font-bold text-gray-400 uppercase mb-4 tracking-widest">Nivel de Rigor</h4>
                <button @click="config.rigor = 'Strict'" class="btn-mode" :class="config.rigor === 'Strict' ? 'btn-active' : 'text-gray-500'">
                    <i data-lucide="lock" class="w-4 h-4"></i> Estricto (Bloqueo)
                </button>
                <button @click="config.rigor = 'Normal'" class="btn-mode" :class="config.rigor === 'Normal' ? 'btn-active' : 'text-gray-500'">
                    <i data-lucide="unlock" class="w-4 h-4"></i> No tan estricto
                </button>

                <h4 class="text-[10px] font-bold text-gray-400 uppercase my-4 tracking-widest">Estilo de Chat</h4>
                <div class="space-y-1">
                    <button @click="config.modo = 'Normal'" class="btn-mode" :class="config.modo === 'Normal' ? 'btn-active' : 'text-gray-500'"><i data-lucide="file-text" class="w-4 h-4"></i> Normal</button>
                    <button @click="config.modo = 'Coloquial'" class="btn-mode" :class="config.modo === 'Coloquial' ? 'btn-active' : 'text-gray-500'"><i data-lucide="smile" class="w-4 h-4"></i> Coloquial</button>
                    <button @click="config.modo = 'Formal'" class="btn-mode" :class="config.modo === 'Formal' ? 'btn-active' : 'text-gray-500'"><i data-lucide="book" class="w-4 h-4"></i> Gramática (Formal)</button>
                    <button @click="config.modo = 'Business'" class="btn-mode" :class="config.modo === 'Business' ? 'btn-active' : 'text-gray-500'"><i data-lucide="briefcase" class="w-4 h-4"></i> Entrevista Trabajo</button>
                    <button @click="config.modo = 'Travel'" class="btn-mode" :class="config.modo === 'Travel' ? 'btn-active' : 'text-gray-500'"><i data-lucide="plane" class="w-4 h-4"></i> Viajes</button>
                </div>

                <button @click="window.location.reload()" class="w-full mt-4 p-3 rounded-xl text-red-500 font-bold text-xs flex items-center justify-center gap-2 border border-red-50 hover:bg-red-50 transition">
                    <i data-lucide="refresh-cw" class="w-3 h-3"></i> Reiniciar App
                </button>
            </div>

            <div x-show="popups.trans" x-cloak class="absolute top-24 right-6 bg-white rounded-[40px] popup-card z-[100] p-8 border border-gray-100 shadow-2xl" @click.away="popups.trans = false" style="width: 400px;">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xs font-black text-gray-400 uppercase tracking-widest">Translator / Traductor</h2>
                    <button @click="popups.trans = false" class="text-red-400"><i data-lucide="x" class="w-5 h-5"></i></button>
                </div>

                <div class="trans-box">
                    <div class="flex justify-between trans-label text-migo-orange"><span>Español > Inglés</span> <i data-lucide="refresh-cw" class="w-3 h-3 opacity-30"></i></div>
                    <textarea placeholder="Escribe..." class="w-full bg-transparent resize-none h-16 outline-none text-gray-600 font-bold text-sm"></textarea>
                    <div class="border-t border-gray-100 my-3 pt-3">
                        <div class="flex justify-between items-center">
                            <span class="text-[9px] font-bold text-migo-green uppercase">Result</span>
                            <i data-lucide="copy" class="w-4 h-4 text-gray-300"></i>
                        </div>
                        <div class="text-sm text-gray-400 mt-1 min-h-[20px]">...</div>
                    </div>
                </div>

                <div class="trans-box">
                    <div class="flex justify-between trans-label text-migo-orange"><span>English > Spanish</span> <i data-lucide="refresh-cw" class="w-3 h-3 opacity-30"></i></div>
                    <textarea placeholder="Type..." class="w-full bg-transparent resize-none h-16 outline-none text-gray-600 font-bold text-sm"></textarea>
                    <div class="border-t border-gray-100 my-3 pt-3">
                        <div class="flex justify-between items-center">
                            <span class="text-[9px] font-bold text-migo-green uppercase">Resultado</span>
                            <i data-lucide="copy" class="w-4 h-4 text-gray-300"></i>
                        </div>
                        <div class="text-sm text-gray-400 mt-1 min-h-[20px]">...</div>
                    </div>
                </div>
            </div>

            <div x-show="popups.user" x-cloak class="fixed bottom-6 left-[80px] w-[280px] bg-white rounded-[35px] popup-card z-[300] p-8 border border-gray-100">
                <p class="font-bold text-gray-800">Sergi Pérez</p>
                <p class="text-[10px] text-migo-green font-bold uppercase" x-text="config.rigor"></p>
            </div>
        </section>
    </main>

    <script>
        function migoApp() {
            return {
                userInput: '', loading: false, correction: '',
                popups: { config: false, trans: false, user: false },
                config: { rigor: 'Normal', modo: 'Normal' },
                messages: [{ role: 'migo', text: 'Hello! I am Migo.' }],
                async send() {
                    if (this.loading) return;
                    const text = this.userInput.trim();
                    if (!text) return;
                    this.messages.push({ role: 'user', text: text });
                    this.userInput = ''; this.loading = true;
                    try {
                        const response = await fetch('/api/chat', { 
                            method: 'POST', 
                            headers: { 'Content-Type': 'application/json' }, 
                            body: JSON.stringify({ rigor: this.config.rigor, modo: this.config.modo, messages: this.messages }) 
                        });
                        const data = await response.json();
                        this.messages.push({ role: 'migo', text: data.reply });
                        if (data.hasError) this.correction = data.fix;
                        else this.correction = "Perfect! No mistakes.";
                    } catch (e) { 
                        this.messages.push({ role: 'migo', text: 'Error' }); 
                    } finally { 
                        this.loading = false; lucide.createIcons(); this.scrollToBottom();
                    }
                },
                scrollToBottom() { const c = document.getElementById('chat-container'); if(c) setTimeout(()=>c.scrollTop = c.scrollHeight, 50); }
            }
        }
    </script>
</body>
</html>
