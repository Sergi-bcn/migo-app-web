<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Migo - App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: { extend: { colors: { migo: { orange: '#ff9800', green: '#4caf50', bg: '#f0f2f5' } }, fontFamily: { sans: ['Quicksand', 'sans-serif'] } } }
        }
    </script>
    <style>
        [x-cloak] { display: none !important; }
        .popup-card { border: 1px solid #f1f5f9; box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1); }
        .popup-arrow-top::before { content: ''; position: absolute; top: -8px; right: 24px; width: 16px; height: 16px; background: white; transform: rotate(45deg); border-left: 1px solid #f1f5f9; border-top: 1px solid #f1f5f9; }
        /* Pico de usuario en la parte inferior izquierda */
        .popup-arrow-user::before { content: ''; position: absolute; left: -8px; bottom: 30px; transform: rotate(45deg); width: 16px; height: 16px; background: white; border-left: 1px solid #f1f5f9; border-bottom: 1px solid #f1f5f9; }
    </style>
</head>
<body class="bg-migo-bg h-screen flex overflow-hidden font-sans" x-data="migoApp()" x-init="lucide.createIcons()">
    
    <nav class="w-20 bg-migo-orange h-full flex flex-col items-center py-8 flex-shrink-0 relative z-[200]">
        <div class="flex flex-col gap-6">
            <button class="w-12 h-12 bg-white/20 rounded-2xl flex items-center justify-center text-white"><i data-lucide="home"></i></button>
            <button class="w-12 h-12 bg-white/20 rounded-2xl flex items-center justify-center text-white"><i data-lucide="book-open"></i></button>
        </div>
        <button @click="popups.user = !popups.user" class="mt-auto w-12 h-12 bg-white rounded-full flex items-center justify-center text-migo-orange font-black text-xl shadow-lg active:scale-95 transition-transform relative z-[210]">S</button>
    </nav>

    <main class="flex-1 flex p-6 gap-6 overflow-hidden relative">
        
        <div x-show="popups.user" x-cloak x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 -translate-x-10"
             class="fixed bottom-6 left-[95px] w-[280px] bg-white rounded-[35px] popup-card z-[300] p-8 popup-arrow-user">
            <div class="flex justify-between items-start mb-4">
                <div class="flex items-center gap-4">
                    <div class="w-14 h-14 bg-orange-100 rounded-2xl flex items-center justify-center text-migo-orange font-black text-xl">S</div>
                    <div>
                        <h4 class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Usuario</h4>
                        <p class="font-bold text-gray-800 text-lg leading-tight">Sergi Pérez</p>
                    </div>
                </div>
                <button @click="popups.user = false" class="text-red-400 hover:text-red-600 transition"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <p class="text-[9px] font-bold text-gray-300 uppercase tracking-tighter">Nivel Rigor</p>
                    <p class="text-[11px] font-bold text-migo-green" x-text="config.rigor"></p>
                </div>
                <div>
                    <p class="text-[9px] font-bold text-gray-300 uppercase tracking-tighter">Conversación</p>
                    <p class="text-[11px] font-bold text-migo-green" x-text="config.modo"></p>
                </div>
            </div>
        </div>

        <section class="w-full max-w-[360px] bg-white rounded-[40px] shadow-sm flex flex-col border border-gray-100 overflow-hidden relative z-10">
            <header class="p-6 border-b border-gray-50 flex items-center gap-3">
                <div class="w-2.5 h-2.5 bg-red-500 rounded-full animate-pulse"></div>
                <h2 class="font-extrabold text-migo-orange text-[10px] tracking-[0.2em] uppercase">Corrections</h2>
            </header>
            <div class="flex-1 p-6 text-gray-700 text-sm" x-html="correction || 'Waiting for phrases...'"></div>
        </section>

        <section class="flex-1 bg-white rounded-[40px] shadow-sm flex flex-col relative border border-gray-100 z-20 overflow-hidden">
            <header class="p-7 flex justify-between items-center relative z-50">
                <h1 class="text-3xl font-extrabold text-gray-800 tracking-tight">Migo<span class="text-migo-orange">.</span></h1>
                
                <div class="flex bg-gray-100 p-1.5 rounded-full relative transition-all duration-300 ease-in-out"
                     :style="(popups.config && popups.trans) ? 'width: 400px; justify-content: space-between;' : 'width: 96px; justify-content: flex-end;'">
                    
                    <button @click="popups.config = !popups.config" 
                            class="w-10 h-10 flex items-center justify-center rounded-full transition-all duration-300 ease-in-out" 
                            :class="popups.config ? 'bg-white shadow-sm text-migo-orange' : 'text-gray-400 hover:text-gray-600'">
                        <i data-lucide="message-square-text" class="w-5 h-5"></i>
                    </button>

                    <button @click="popups.trans = !popups.trans" 
                            class="w-10 h-10 flex items-center justify-center rounded-full transition" 
                            :class="popups.trans ? 'bg-white shadow-sm text-migo-orange' : 'text-gray-400 hover:text-gray-600'">
                        <i data-lucide="languages" class="w-5 h-5"></i>
                    </button>
                </div>
            </header>

            <div class="flex-1 mx-6 bg-gray-50/50 rounded-[35px] p-8 overflow-y-auto flex flex-col gap-5">
                <template x-for="msg in messages">
                    <div :class="msg.role === 'migo' ? 'self-start bg-migo-orange text-white rounded-bl-none' : 'self-end bg-white text-gray-700 shadow-sm rounded-br-none'" 
                         class="max-w-[75%] p-5 px-7 rounded-[28px] font-semibold text-[15px]" x-text="msg.text"></div>
                </template>
            </div>

            <div class="p-8 flex gap-4 items-center">
                <div class="flex-1 bg-gray-50 rounded-[25px] px-6 py-2 border border-transparent focus-within:border-migo-orange/20 transition-all">
                    <textarea x-model="userInput" @keydown.enter.prevent="send()" class="w-full outline-none py-3 text-[15px] h-12 bg-transparent text-gray-700 resize-none" placeholder="Escribe aquí..."></textarea>
                </div>
                <button @click="send()" class="w-14 h-14 bg-migo-green text-white rounded-[20px] flex items-center justify-center shadow-lg hover:brightness-105 active:scale-95 transition-all"><i data-lucide="arrow-right" class="w-6 h-6"></i></button>
            </div>

            <div x-show="popups.config" x-cloak x-transition 
                 class="absolute top-24 w-[280px] bg-white rounded-[30px] popup-card z-[100] p-6 popup-arrow-top transition-all duration-300"
                 :class="popups.trans ? 'right-[380px]' : 'right-14'">
                
                <div class="flex justify-between items-center mb-4">
                    <h4 class="text-[10px] font-extrabold text-gray-400 tracking-widest uppercase">Nivel de Rigor</h4>
                    <button @click="popups.config = false" class="text-red-400 hover:text-red-600 transition"><i data-lucide="x" class="w-5 h-5"></i></button>
                </div>

                <div class="flex flex-col gap-2 mb-4">
                    <button @click="config.rigor = 'Estricto'" 
                            class="w-full p-3 rounded-2xl text-sm font-bold transition-all text-left flex items-center gap-2"
                            :class="config.rigor === 'Estricto' ? 'bg-migo-green text-white shadow-md' : 'bg-gray-50 text-gray-500 hover:bg-gray-100'">
                        <span>🔒</span> Estricto
                    </button>
                    <button @click="config.rigor = 'Normal'" 
                            class="w-full p-3 rounded-2xl text-sm font-bold transition-all text-left flex items-center gap-2"
                            :class="config.rigor === 'Normal' ? 'bg-migo-green text-white shadow-md' : 'bg-gray-50 text-gray-500 hover:bg-gray-100'">
                        <span>🍃</span> Normal
                    </button>
                </div>

                <h4 class="text-[10px] font-extrabold text-gray-400 tracking-widest uppercase mb-3">Modo Conversación</h4>
                <div class="flex flex-col gap-2">
                    <template x-for="m in ['Coloquial', 'Formal', 'Entrevista Trabajo', 'Viajes']">
                        <button @click="config.modo = m" 
                                class="w-full p-3 rounded-2xl text-[13px] font-bold transition-all text-left"
                                :class="config.modo === m ? 'bg-migo-green text-white shadow-md' : 'bg-gray-50 text-gray-500 hover:bg-gray-100'"
                                x-text="m"></button>
                    </template>
                </div>
            </div>

            <div x-show="popups.trans" x-cloak x-transition class="absolute top-24 right-6 w-[340px] bg-white rounded-[30px] popup-card z-[100] p-6 popup-arrow-top flex flex-col h-[400px]">
                <div class="flex justify-between items-center mb-4 flex-shrink-0">
                    <h4 class="text-[10px] font-extrabold text-gray-400 tracking-widest uppercase">Traductor</h4>
                    <button @click="popups.trans = false" class="text-red-400 hover:text-red-600 transition"><i data-lucide="x" class="w-5 h-5"></i></button>
                </div>
                <div class="flex-1 flex flex-col gap-4 overflow-hidden">
                    <div class="flex flex-col h-1/2">
                        <div class="flex justify-between items-center mb-1 px-1"><span class="text-[10px] font-bold text-orange-400 uppercase">Español > Inglés</span><i data-lucide="refresh-cw" class="w-3 h-3 text-gray-300"></i></div>
                        <textarea class="w-full flex-1 bg-green-50/30 border border-green-100 rounded-xl p-3 text-sm outline-none resize-none" placeholder="Escribe..."></textarea>
                        <div class="mt-1 p-2 bg-gray-50 rounded-lg border border-dashed border-gray-200 text-[10px] text-gray-400 flex justify-between items-center font-bold">RESULT <i data-lucide="copy" class="w-3 h-3"></i></div>
                    </div>
                    <div class="flex flex-col h-1/2">
                        <div class="flex justify-between items-center mb-1 px-1"><span class="text-[10px] font-bold text-orange-400 uppercase">English > Spanish</span><i data-lucide="refresh-cw" class="w-3 h-3 text-gray-300"></i></div>
                        <textarea class="w-full flex-1 bg-green-50/30 border border-green-100 rounded-xl p-3 text-sm outline-none resize-none" placeholder="Type..."></textarea>
                        <div class="mt-1 p-2 bg-gray-50 rounded-lg border border-dashed border-gray-200 text-[10px] text-gray-400 flex justify-between items-center font-bold">RESULTADO <i data-lucide="copy" class="w-3 h-3"></i></div>
                    </div>
                </div>
            </div>

        </section>
    </main>

    <script>
        function migoApp() {
            return {
                userInput: '', correction: '',
                popups: { config: false, trans: false, user: false },
                config: { rigor: 'Normal', modo: 'Coloquial' },
                messages: [{ role: 'migo', text: '¡Diseño equilibrado Sergi! Altura simétrica, cierre uniforme y pico de usuario en la esquina inferior.' }],
                async send() {
                    if (!this.userInput.trim()) return;
                    this.messages.push({ role: 'user', text: this.userInput });
                    this.userInput = '';
                }
            }
        }
    </script>
</body>
</html>
