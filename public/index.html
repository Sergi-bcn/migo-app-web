<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Migo - Ultra Modular</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="/css/navbar.css">
    <link rel="stylesheet" href="/css/corrections.css">
    <link rel="stylesheet" href="/css/chat.css">
    <link rel="stylesheet" href="/css/popup-user.css">
    <link rel="stylesheet" href="/css/popup-trans.css">
    <link rel="stylesheet" href="/css/popup-config.css">

    <script src="https://unpkg.com/lucide@latest"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>[x-cloak] { display: none !important; } body { background: #f0f2f5; font-family: 'Quicksand', sans-serif; }</style>
</head>
<body x-data="migoApp()" x-init="init()" class="h-screen flex overflow-hidden">
    
    <div id="mw-navbar"></div>

    <main class="flex-1 flex p-6 pr-2 gap-6 overflow-hidden relative">
        <div id="mw-corrections"></div>
        <div id="mw-chat" class="flex-1 flex flex-col relative h-full"></div>
        
        <div id="mw-popup-config"></div>
        <div id="mw-popup-trans"></div>
        <div id="mw-popup-user"></div>
    </main>

    <script src="/js/app.js"></script>
</body>
</html>
