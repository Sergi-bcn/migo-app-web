<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Migo - App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: { extend: { colors: { migo: { orange: '#ff9800', green: '#4caf50', bg: '#f0f2f5' } }, fontFamily: { sans: ['Quicksand', 'sans-serif'] } } }
        }
    </script>
    <style>
        [x-cloak] { display: none !important; }
        .popup-card { border: 1px solid #f1f5f9; box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1); }
        .popup-arrow-top::before { content: ''; position: absolute; top: -8px; right: 24px; width: 16px; height: 16px; background: white; transform: rotate(45deg); border-left: 1px solid #f1f5f9; border-top: 1px solid #f1f5f9; }
        .popup-arrow-user::before { content: ''; position: absolute; left: -8px; bottom: 30px; transform: rotate(45deg); width: 16px; height: 16px; background: white; border-left: 1px solid #f1f5f9; border-bottom: 1px solid #f1f5f9; }
        .scroll-smooth-custom { scroll-behavior: smooth; }
        
        /* Custom Tooltip */
        .migo-tooltip { position: relative; }
        .migo-tooltip::after {
            content: attr(data-tip); position: absolute; left: 120%; top: 50%; transform: translateY(-50%);
            background: #1a1a1a; color: white; padding: 6px 12px; border-radius: 8px; font-size: 11px;
            white-space: nowrap; opacity: 0; pointer-events: none; transition: all 0.1s ease; z-index: 500; font-weight: bold;
        }
        .migo-tooltip:hover::after { opacity: 1; left: 110%; }
        .tooltip-top::after { left: 50% !important; top: -10px !important; transform: translate(-50%, -100%) !important; }
        .tooltip-top:hover::after { top: -5px !important; }
    </style>
</head>
<body class="bg-migo-bg h-screen flex overflow-hidden font-sans" x-data="migoApp()" x-init="lucide.createIcons(); $watch('messages', () => scrollToBottom())">
    
    <nav class="w-16 bg-migo-orange h-full flex flex-col items-center py-8 flex-shrink-0 relative z-[200]">
        <div class="flex flex-col gap-6 items-center w-full">
            <button data-tip="Home / Inicio" class="migo-tooltip w-11 h-11 bg-white/20 rounded-2xl flex items-center justify-center text-white hover:bg-white/30 transition-all shadow-sm"><i data-lucide="home" class="w-5 h-5"></i></button>
            <button data-tip="Lessons / Lecciones" class="migo-tooltip w-11 h-11 bg-white/20 rounded-2xl flex items-center justify-center text-white hover:bg-white/30 transition-all shadow-sm"><i data-lucide="book-open" class="w-5 h-5"></i></button>
        </div>
        <button @click="popups.user = !popups.user" data-tip="Profile / Perfil" class="migo-tooltip mt-auto w-11 h-11 bg-white rounded-full flex items-center justify-center text-migo-orange font-black text-lg shadow-lg active:scale-95 transition-transform relative z-[210]">S</button>
    </nav>

    <main class="flex-1 flex p-6 gap-6 overflow-hidden relative">
        <div x-show="popups.user" x-cloak x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 -translate-x-10"
             class="fixed bottom-6 left-[80px] w-[280px] bg-white rounded-[35px] popup-card z-[300] p-8 popup-arrow-user">
            <div class="flex justify-between items-start mb-4">
                <div class="flex items-center gap-4">
                    <div class="w-14 h-14 bg-orange-100 rounded-2xl flex items-center justify-center text-migo-orange font-black text-xl">S</div>
                    <div><h4 class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">User / Usuario</h4><p class="font-bold text-gray-800 text-lg leading-tight">Sergi Pérez</p></div>
                </div>
                <button @click="popups.user = false" class="text-red-400 hover:text-red-600 transition"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div><p class="text-[9px] font-bold text-gray-300 uppercase tracking-tighter">Rigor Level</p><p class="text-[11px] font-bold text-migo-green" x-text="config.rigor"></p></div>
                <div><p class="text-[9px] font-bold text-gray-300 uppercase tracking-tighter">Chat Mode</p><p class="text-[11px] font-bold text-migo-green" x-text="config.modo"></p></div>
            </div>
        </div>

        <section class="w-full max-w-[340px] bg-white rounded-[40px] shadow-sm flex flex-col border border-gray-100 overflow-hidden relative z-10">
            <header class="p-6 border-b border-gray-50 flex items-center gap-3">
                <div class="w-2.5 h-2.5 bg-red-500 rounded-full animate-pulse"></div>
                <h2 class="font-extrabold text-migo-orange text-[10px] tracking-[0.2em] uppercase">Corrections / Correcciones</h2>
            </header>
            <div class="flex-1 p-6 text-gray-700 text-sm">
                <template x-if="lockMode">
                    <div class="bg-red-50 p-4 rounded-2xl border border-red-100 mb-4 animate-bounce">
                        <p class="text-red-600 font-bold text-xs uppercase mb-2">Challenge / Desafío:</p>
                        <p class="text-gray-800 font-bold italic" x-text="'Write: ' + correction"></p>
                    </div>
                </template>
                <div x-html="correction || 'Waiting for phrases... / Esperando frases...'"></div>
            </div>
        </section>

        <section class="flex-1 bg-white rounded-[40px] shadow-sm flex flex-col relative border border-gray-100 z-20 overflow-hidden">
            <header class="p-7 flex justify-between items-center relative z-50">
                <h1 class="text-3xl font-extrabold text-gray-800 tracking-tight">Migo<span class="text-migo-orange">.</span></h1>
                <div class="flex bg-gray-100 p-1.5 rounded-full relative transition-all duration-300" :style="(popups.config && popups.trans) ? 'width: 400px; justify-content: space-between;' : 'width: 96px; justify-content: flex-end;'">
                    <button @click="popups.config = !popups.config" data-tip="Settings / Ajustes" class="migo-tooltip tooltip-top w-10 h-10 flex items-center justify-center rounded-full transition" :class="popups.config ? 'bg-white shadow-sm text-migo-orange' : 'text-gray-400 hover:text-gray-600'"><i data-lucide="message-square-text" class="w-5 h-5"></i></button>
                    <button @click="popups.trans = !popups.trans" data-tip="Translator / Traductor" class="migo-tooltip tooltip-top w-10 h-10 flex items-center justify-center rounded-full transition" :class="popups.trans ? 'bg-white shadow-sm text-migo-orange' : 'text-gray-400 hover:text-gray-600'"><i data-lucide="languages" class="w-5 h-5"></i></button>
                </div>
            </header>

            <div id="chat-container" class="flex-1 mx-6 bg-gray-50/50 rounded-[35px] p-8 overflow-y-auto flex flex-col gap-5 scroll-smooth-custom">
                <template x-for="msg in messages">
                    <div :class="msg.role === 'user' ? 'bg-white text-gray-700 shadow-sm rounded-bl-none ml-auto self-end' : 'bg-migo-orange text-white rounded-bl-none self-start'" 
                         class="max-w-[85%] p-5 px-7 rounded-[28px] font-semibold text-[15px]" x-text="msg.text"></div>
                </template>
                <div x-show="loading" class="self-start text-gray-400 text-xs font-bold animate-pulse px-7 uppercase">Migo is typing... / escribiendo...</div>
            </div>

            <div class="p-8 flex gap-4 items-center">
                <div class="flex-1 rounded-[25px] px-6 py-2 border transition-all" 
                     :class="lockMode ? 'bg-red-50 border-red-200' : 'bg-gray-50 border-transparent focus-within:border-migo-orange/20'">
                    <textarea x-model="userInput" @keydown.enter.prevent="send()" 
                              class="w-full outline-none py-3 text-[15px] h-12 bg-transparent text-gray-700 resize-none" 
                              :placeholder="lockMode ? 'Rewrite correctly... / Escribe corregido...' : 'Type in English... / Escribe en Inglés...'"></textarea>
                </div>
                <button @click="send()" :disabled="loading" data-tip="Send / Enviar" class="migo-tooltip tooltip-top w-14 h-14 bg-migo-green text-white rounded-[20px] flex items-center justify-center shadow-lg hover:brightness-105 active:scale-95 transition-all disabled:opacity-50"><i data-lucide="arrow-right" class="w-6 h-6"></i></button>
            </div>

            <div x-show="popups.config" x-cloak x-transition class="absolute top-24 w-[280px] bg-white rounded-[30px] popup-card z-[100] p-6 popup-arrow-top transition-all" :class="popups.trans ? 'right-[380px]' : 'right-14'">
                <div class="flex justify-between items-center mb-4"><h4 class="text-[10px] font-extrabold text-gray-400 tracking-widest uppercase">Difficulty / Dificultad</h4><button @click="popups.config = false" class="text-red-400"><i data-lucide="x" class="w-5 h-5"></i></button></div>
                <div class="flex flex-col gap-2 mb-4">
                    <button @click="config.rigor = 'Strict / Estricto'" class="w-full p-3 rounded-2xl text-sm font-bold text-left" :class="config.rigor.includes('Strict') ? 'bg-migo-green text-white shadow-md' : 'bg-gray-50 text-gray-500 hover:bg-gray-100'">🔒 Strict / Estricto</button>
                    <button @click="config.rigor = 'Normal'" class="w-full p-3 rounded-2xl text-sm font-bold text-left" :class="config.rigor === 'Normal' ? 'bg-migo-green text-white shadow-md' : 'bg-gray-50 text-gray-500 hover:bg-gray-100'">🍃 Normal</button>
                </div>
                <h4 class="text-[10px] font-extrabold text-gray-400 tracking-widest uppercase mb-3">Mode / Modo</h4>
                <div class="flex flex-col gap-2">
                    <template x-for="m in ['Colloquial / Coloquial', 'Formal', 'Interview / Entrevista', 'Travel / Viajes']">
                        <button @click="config.modo = m" class="w-full p-3 rounded-2xl text-[13px] font-bold text-left" :class="config.modo === m ? 'bg-migo-green text-white shadow-md' : 'bg-gray-50 text-gray-500 hover:bg-gray-100'" x-text="m"></button>
                    </template>
                </div>
            </div>

            <div x-show="popups.trans" x-cloak x-transition class="absolute top-24 right-6 w-[340px] bg-white rounded-[30px] popup-card z-[100] p-6 popup-arrow-top flex flex-col h-[400px]">
                <div class="flex justify-between items-center mb-4"><h4 class="text-[10px] font-extrabold text-gray-400 tracking-widest uppercase">Translator / Traductor</h4><button @click="popups.trans = false" class="text-red-400 hover:text-red-600 transition"><i data-lucide="x" class="w-5 h-5"></i></button></div>
                <div class="flex-1 flex flex-col gap-4 overflow-hidden">
                    <div class="flex flex-col h-1/2 relative">
                        <p class="text-[9px] font-bold text-migo-orange uppercase mb-1">Spanish to English</p>
                        <textarea x-model="transTexts.es" @keydown.enter.prevent="runTranslation('es')" class="w-full h-full bg-green-50/30 border border-green-100 rounded-xl p-3 text-sm outline-none resize-none" placeholder="Escribe aquí..."></textarea>
                        <button @click="runTranslation('es')" class="absolute right-2 bottom-2 text-migo-green"><i data-lucide="arrow-right-circle" class="w-5 h-5"></i></button>
                        <div class="mt-1 p-2 bg-gray-50 rounded-lg text-[10px] font-bold" x-text="results.es || 'RESULTADO'"></div>
                    </div>
                    <div class="flex flex-col h-1/2 relative">
                        <p class="text-[9px] font-bold text-migo-orange uppercase mb-1">English to Spanish</p>
                        <textarea x-model="transTexts.en" @keydown.enter.prevent="runTranslation('en')" class="w-full h-full bg-green-50/30 border border-green-100 rounded-xl p-3 text-sm outline-none resize-none" placeholder="Type here..."></textarea>
                        <button @click="runTranslation('en')" class="absolute right-2 bottom-2 text-migo-green"><i data-lucide="arrow-right-circle" class="w-5 h-5"></i></button>
                        <div class="mt-1 p-2 bg-gray-50 rounded-lg text-[10px] font-bold" x-text="results.en || 'RESULTADO'"></div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        function migoApp() {
            return {
                userInput: '', correction: '', loading: false, lockMode: false,
                popups: { config: false, trans: false, user: false },
                config: { rigor: 'Normal', modo: 'Colloquial / Coloquial' },
                transTexts: { es: '', en: '' }, results: { es: '', en: '' },
                messages: [{ role: 'migo', text: 'Hello Sergi! I am Migo. Ready to practice? / ¡Hola Sergi! Soy Migo. ¿Listo para practicar?' }],
                async send() {
                    const text = this.userInput.trim();
                    if (!text || this.loading) return;

                    // Si estamos bloqueados, verificar si el usuario escribió la corrección exacta
                    if (this.lockMode) {
                        const cleanUser = text.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g,"").toLowerCase();
                        const cleanFix = this.correction.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g,"").toLowerCase();
                        
                        if (cleanUser === cleanFix) {
                            this.lockMode = false;
                            this.messages.push({ role: 'user', text: text });
                            this.userInput = '';
                            this.correction = "Perfect! Let's continue. / ¡Perfecto! Continuemos.";
                        } else {
                            this.userInput = '';
                            alert("Not quite! Try to write exactly: " + this.correction);
                            return;
                        }
                    } else {
                        this.messages.push({ role: 'user', text: text });
                        this.userInput = '';
                    }

                    this.loading = true;
                    try {
                        const response = await fetch('/api/chat', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                rigor: this.config.rigor, modo: this.config.modo,
                                messages: this.messages.map(m => ({ role: m.role, content: m.text }))
                            })
                        });
                        const data = await response.json();
                        
                        if (data.reply) {
                            this.messages.push({ role: 'migo', text: data.reply });
                            if (data.hasError) {
                                this.lockMode = true;
                                this.correction = data.fix;
                            } else {
                                if (data.fix) this.correction = data.fix;
                            }
                        }
                    } catch (e) {
                        this.messages.push({ role: 'migo', text: "Error: " + e.message });
                    } finally {
                        this.loading = false;
                        lucide.createIcons();
                    }
                },
                async runTranslation(lang) {
                    const text = (lang === 'es' ? this.transTexts.es : this.transTexts.en).trim();
                    if (!text) return;
                    const [s, t] = lang === 'es' ? ['es', 'en'] : ['en', 'es'];
                    const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${s}&tl=${t}&dt=t&q=${encodeURIComponent(text)}`);
                    const data = await res.json();
                    lang === 'es' ? this.results.es = data[0][0][0] : this.results.en = data[0][0][0];
                },
                scrollToBottom() {
                    const c = document.getElementById('chat-container');
                    if (c) setTimeout(() => { c.scrollTop = c.scrollHeight; }, 50);
                }
            }
        }
    </script>
</body>
</html>
