<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Migo AI - Diseño Estable</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* RESET PARA EVITAR DESVIRTUALIZACIÓN */
        body, html { margin: 0; padding: 0; height: 100vh; overflow: hidden; background: #f8fafc; font-family: 'Segoe UI', sans-serif; }
        
        /* LAYOUT PRINCIPAL */
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* HEADER NARANJA ORIGINAL */
        header {
            height: 70px;
            background: white;
            border-bottom: 4px solid #f39c12; /* Tu barra naranja */
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            flex-shrink: 0;
            z-index: 1000;
        }

        /* CUERPO: CHAT + SIDEBAR DE ERRORES */
        .main-content {
            display: flex;
            flex: 1;
            overflow: hidden; /* Esto impide que la página entera haga scroll */
        }

        /* VENTANA DE CONVERSACIÓN (ÚNICA CON SCROLL) */
        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: #f8fafc;
        }

        /* BARRA LATERAL DE ERRORES FIJA */
        #error-sidebar {
            width: 320px;
            background: white;
            border-left: 1px solid #edf2f7;
            padding: 20px;
            overflow-y: auto;
            flex-shrink: 0;
        }

        /* FOOTER CON INPUT */
        footer {
            height: 100px;
            background: white;
            border-top: 1px solid #edf2f7;
            display: flex;
            align-items: center;
            padding: 0 25px;
            flex-shrink: 0;
        }

        .input-wrapper { max-width: 900px; margin: 0 auto; display: flex; width: 100%; gap: 15px; }
        input { flex: 1; padding: 15px 25px; border-radius: 30px; border: 1px solid #e2e8f0; outline: none; font-size: 16px; }
        button { background: #f39c12; color: white; border: none; padding: 0 35px; border-radius: 30px; cursor: pointer; font-weight: bold; }

        /* VENTANAS EMERGENTES PROTEGIDAS */
        .popup-modal { 
            position: fixed; 
            top: 80px; 
            right: 20px; /* Alineadas sobre la sidebar */
            z-index: 9999; 
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <div style="font-weight:bold; font-size:26px;">Migo<span style="color:#f39c12">.</span></div>
        <div style="display:flex; gap:20px;">
            <button onclick="togglePopup(event, 'popup-config')" style="background:none; border:none; cursor:pointer; font-size:24px;">⚙️</button>
            <button onclick="togglePopup(event, 'popup-translate')" style="background:none; border:none; cursor:pointer; font-size:24px;">🌐</button>
        </div>
    </header>

    <div id="popup-config" class="popup-modal"></div>
    <div id="popup-translate" class="popup-modal"></div>

    <div class="main-content">
        <main id="chat-box"></main>
        
        <aside id="error-sidebar">
            <h4 style="margin-top:0; border-bottom:3px solid #f39c12; padding-bottom:8px;">Registro de Errores</h4>
            <div id="log-content" style="font-size:12px; color:#64748b;"></div>
        </aside>
    </div>

    <footer>
        <div class="input-wrapper">
            <input type="text" id="user-input" placeholder="Pregunta algo a Migo..." onkeypress="if(event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()">Enviar</button>
        </div>
    </footer>
</div>

<script src="js/chat-logic.js"></script>
</body>
</html>
