<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Migo - App</title>
    <link rel="stylesheet" href="CSS/base.css">
    <link rel="stylesheet" href="CSS/layout.css">
    <link rel="stylesheet" href="CSS/components.css">
    <link rel="stylesheet" href="CSS/chat.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
</head>
<body class="bg-main">

    <nav class="sidebar-naranja">
        <div class="nav-bottom-group">
            <div class="anchor">
                <button class="nav-circle-btn" onclick="togglePopup(event, 'popup-settings-main')">
                    <img src="https://cdn-icons-png.flaticon.com/512/3524/3524659.png" width="20">
                </button>
            </div>
            <div class="anchor">
                <button class="nav-circle-btn btn-s" onclick="togglePopup(event, 'popup-user')">S</button>
            </div>
        </div>
    </nav>

    <div class="main-screen">
        <div class="content-layout">
            <aside class="panel-white correction-panel">
                <div class="panel-header"><span class="dot red"></span> CORRECTIONS / CORRECCIONES</div>
                <div id="corrections-container" class="scroll-area">
                    <p class="empty-msg">No hay correcciones todavía.</p>
                </div>
            </aside>

            <div class="center-column">
                <header class="app-header">
                    <div class="logo-area">
                        <h1 class="logo">Migo<span>.</span></h1>
                        <p class="subtitle">WEB COMPANION</p>
                    </div>
                    <div class="header-tools">
                        <div class="anchor">
                            <button class="tool-btn-circle" onclick="togglePopup(event, 'popup-config')">
                                <img src="https://cdn-icons-png.flaticon.com/512/5968/5968812.png" width="24">
                            </button>
                            <div id="popup-config" class="popup-modal anchor-down">
                                <div class="popup-header"><span>ESTILO DE CHAT</span></div>
                                <div class="options-list">
                                    <button class="opt-row active" onclick="setConfig('style', 'Normal', this)">📝 Normal</button>
                                    <button class="opt-row" onclick="setConfig('style', 'Coloquial', this)">✍️ Coloquial</button>
                                    <button class="opt-row" onclick="setConfig('style', 'Viajes', this)">✈️ Viajes</button>
                                </div>
                            </div>
                        </div>

                        <div class="anchor">
                            <button class="tool-btn-circle" onclick="togglePopup(event, 'popup-translate')">
                                <img src="https://upload.wikimedia.org/wikipedia/commons/d/d7/Google_Translate_logo.svg" width="24">
                            </button>
                            <div id="popup-translate" class="popup-modal translate-box anchor-down">
                                <div class="popup-header"><span>TRADUCTOR</span></div>
                                <textarea id="input-es" placeholder="Escribe aquí..."></textarea>
                                <div class="res-preview" id="res-en">Traducción...</div>
                            </div>
                        </div>
                    </div>
                </header>

                <main class="panel-white chat-panel">
                    <div id="chat-box" class="scroll-area chat-feed">
                        <div class="bubble bot">Hello Sergi! I'm ready to practice.</div>
                    </div>
                    <div class="chat-input-wrapper">
                        <input type="text" id="user-input" placeholder="Escribe en inglés...">
                        <button class="send-btn" onclick="sendMessage()">➔</button>
                    </div>
                </main>
            </div>
        </div>
    </div>

    <div id="popup-settings-main" class="popup-modal sidebar-popup">
        <div class="popup-header"><span>AJUSTES</span></div>
        <div class="options-list">
            <button class="opt-row active" onclick="setConfig('rigor', 'Relajado', this)">🔓 Relajado</button>
            <button class="opt-row" onclick="setConfig('rigor', 'Estricto', this)">🔒 Estricto</button>
        </div>
    </div>

    <div id="popup-user" class="popup-modal sidebar-popup user-card">
        <p class="label">USUARIO</p>
        <p class="val-big">Sergi Pérez</p>
        <hr>
        <div class="user-stats">
            <div><p class="label">RIGOR</p><p id="stat-rigor">Relajado</p></div>
            <div><p class="label">ESTILO</p><p id="stat-style">Normal</p></div>
        </div>
        <button class="btn-reset-app" onclick="location.reload()">Reiniciar Sesión</button>
    </div>

    <script src="js/ui-manager.js"></script>
    <script src="js/chat-logic.js"></script>
</body>
</html>
