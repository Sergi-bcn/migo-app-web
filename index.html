<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Migo Web - Alfa Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --migo-orange: #ff9800; --migo-green: #4caf50; --bg-color: #f0f2f5; }
        body { margin: 0; padding: 0; background-color: var(--bg-color); font-family: 'Quicksand', sans-serif; display: flex; height: 100vh; overflow: hidden; }
        
        /* SIDEBAR */
        .side-nav { width: 80px; background-color: var(--migo-orange); height: 100%; display: flex; flex-direction: column; align-items: center; padding-top: 25px; gap: 20px; flex-shrink: 0; }
        .nav-icon, .profile-circle { width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; }
        .nav-icon { background: rgba(255, 255, 255, 0.2); }
        .profile-circle { background: white; color: var(--migo-orange); font-weight: 800; }

        .main-app { display: flex; flex: 1; padding: 25px; gap: 25px; box-sizing: border-box; width: calc(100% - 80px); }
        .card { background: white; border-radius: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.04); display: flex; flex-direction: column; overflow: hidden; }
        
        /* PANEL IZQUIERDO */
        .panel-left { flex: 1; max-width: 380px; }
        .header-box { padding: 25px; border-bottom: 1px solid #f0f0f0; font-weight: 800; color: var(--migo-orange); display: flex; align-items: center; gap: 10px; }
        .dot { width: 10px; height: 10px; background: #ff5252; border-radius: 50%; }

        /* PANEL DERECHO */
        .panel-right { flex: 2; position: relative; display: flex; flex-direction: column; }
        .chat-header { padding: 20px 30px; display: flex; justify-content: space-between; align-items: center; }
        .header-tools { display: flex; gap: 18px; align-items: center; }
        .tool-btn { cursor: pointer; font-size: 24px; transition: transform 0.2s; }

        .chat-box { flex: 1; padding: 25px; overflow-y: auto; background-color: #fafafa; margin: 0 25px; border-radius: 25px; display: flex; flex-direction: column; gap: 15px; }
        .msg { padding: 14px 20px; border-radius: 20px; max-width: 75%; font-weight: 500; font-size: 0.95rem; line-height: 1.5; }
        .migo { background: var(--migo-orange); color: white; align-self: flex-start; border-bottom-left-radius: 4px; }
        .user { background: #e9ecef; color: #333; align-self: flex-end; border-bottom-right-radius: 4px; }

        .input-area { padding: 25px; display: flex; gap: 15px; }
        .input-box { flex: 1; display: flex; background: white; border: 2px solid #f0f0f0; border-radius: 20px; padding: 5px 20px; align-items: center; }
        #user-input { flex: 1; border: none; outline: none; padding: 12px 0; resize: none; font-family: inherit; font-size: 15px; height: 24px; }
        .btn-send { background: var(--migo-green); color: white; border: none; width: 50px; height: 50px; border-radius: 15px; cursor: pointer; font-size: 22px; display: flex; align-items: center; justify-content: center; }

        /* POPUPS */
        .popup-migo { display: none; position: absolute; top: 85px; right: 30px; width: 320px; background: white; border-radius: 25px; padding: 25px; box-shadow: 0 20px 60px rgba(0,0,0,0.15); z-index: 2000; }
        .close-pop { position: absolute; top: 20px; right: 20px; cursor: pointer; color: #ccc; font-weight: bold; }
    </style>
</head>
<body>

<nav class="side-nav">
    <div class="nav-icon" onclick="togglePopup('pop-config')">⚙️</div>
    <div class="profile-circle" onclick="togglePopup('pop-profile')">S</div>
</nav>

<main class="main-app">
    <div class="card panel-left">
        <div class="header-box"><span class="dot"></span> CORRECTIONS</div>
        <div id="correction-log" style="padding: 25px; color: #666;">Waiting for mistakes to help you...</div>
    </div>

    <div class="card panel-right">
        <header class="chat-header">
            <h1 style="margin:0; font-weight:800; font-size: 28px;">Migo<span style="color:var(--migo-orange)">.</span></h1>
            <div class="header-tools">
                <div class="tool-btn" onclick="togglePopup('pop-chat-conf')">💬</div>
                <div class="tool-btn" onclick="togglePopup('pop-trans')">🌐</div>
            </div>
        </header>

        <div class="chat-box" id="chat-box">
            <div class="msg migo">¡Hola Sergi! Todo listo. ¿Practicamos inglés con Groq?</div>
        </div>

        <div class="input-area">
            <div class="input-box">
                <textarea id="user-input" placeholder="Escribe aquí..." onkeydown="handleEnter(event)"></textarea>
                <button class="btn-send" onclick="talkToMigo()">➜</button>
            </div>
        </div>

        <div class="popup-migo" id="pop-trans"><span class="close-pop" onclick="togglePopup('pop-trans')">✕</span><h3>Translator</h3><p>Listo para traducir frases.</p></div>
        <div class="popup-migo" id="pop-chat-conf"><span class="close-pop" onclick="togglePopup('pop-chat-conf')">✕</span><h3>Settings</h3><p>Modo: Conversación Natural</p></div>
        <div class="popup-migo" id="pop-config"><span class="close-pop" onclick="togglePopup('pop-config')">✕</span><h3>App Config</h3></div>
        <div class="popup-migo" id="pop-profile"><span class="close-pop" onclick="togglePopup('pop-profile')">✕</span><h3>Profile</h3></div>
    </div>
</main>

<script>
    async function talkToMigo() {
        const input = document.getElementById('user-input');
        const text = input.value.trim();
        if (!text) return;

        addMessage(text, 'user');
        input.value = "";

        try {
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text })
            });

            const data = await response.json();
            
            if (response.ok) {
                addMessage(data.reply, 'migo');
                document.getElementById('correction-log').innerHTML = `<div style="background:#fffcf0; padding:15px; border-radius:15px; border-left:4px solid var(--migo-orange);">${data.correction}</div>`;
            } else {
                addMessage("Migo Error: " + (data.reply || "Check API Key"), 'migo');
            }
        } catch (e) {
            addMessage("Error de conexión. Revisa el Redeploy en Vercel.", 'migo');
        }
    }

    function addMessage(text, type) {
        const box = document.getElementById('chat-box');
        const div = document.createElement('div');
        div.className = `msg ${type}`;
        div.innerText = text;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    function handleEnter(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); talkToMigo(); } }
    
    function togglePopup(id) {
        const el = document.getElementById(id);
        const isOpen = el.style.display === 'block';
        document.querySelectorAll('.popup-migo').forEach(p => p.style.display = 'none');
        el.style.display = isOpen ? 'none' : 'block';
    }
</script>
</body>
</html>
