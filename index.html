<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Migo App - English Conversation</title>
    
    <link rel="stylesheet" href="CSS/layout.css">
    <link rel="stylesheet" href="CSS/cssmodules/csscomponents/sidebar.css">
    <link rel="stylesheet" href="CSS/cssmodules/csscomponents/header.css">
    <link rel="stylesheet" href="CSS/cssmodules/csscomponents/wconvers.css">
    <link rel="stylesheet" href="CSS/cssmodules/csscomponents/wregister.css">
    <link rel="stylesheet" href="CSS/cssmodules/csswindows/wuser.css">
    <link rel="stylesheet" href="CSS/cssmodules/csswindows/wtranslator.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body class="bg-main">

    <div id="slot-sidebar"></div>
    
    <div class="main-screen">
        <div class="content-layout">
            
            <aside class="side-panel">
                <div id="slot-register"></div>
            </aside>
            
            <main class="chat-panel">
                <div id="slot-header"></div>
                
                <div id="chat-box" class="chat-feed">
                    </div>
                
                <div class="chat-input-wrapper">
                    <input type="text" 
                           id="user-input" 
                           placeholder="Type in English only..." 
                           onkeypress="return /[a-zA-Z\s?,.!]/.test(event.key)"
                           onkeydown="if(event.key==='Enter') sendMessage()">
                    <button class="send-btn" onclick="sendMessage()">➔</button>
                </div>
            </main>

        </div>
    </div>

    <script src="js/loader.js"></script>
    <script src="js/ui-manager.js"></script>
    <script src="js/chat-logic.js"></script>

</body>
</html>
