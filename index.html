<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Migo Web - Alfa</title>

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --migo-orange: #ff9800;
  --migo-green: #4caf50;
  --bg-color: #f0f2f5;
}

body {
  margin: 0;
  padding: 0;
  background-color: var(--bg-color);
  font-family: 'Quicksand', sans-serif;
  display: flex;
  height: 100vh;
  overflow: hidden;
}

/* SIDEBAR */
.side-nav {
  width: 80px;
  background-color: var(--migo-orange);
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-top: 30px;
  flex-shrink: 0;
}

.nav-item {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: white;
  color: var(--migo-orange);
  font-weight: 800;
  cursor: pointer;
}

/* ✅ CAMBIO ÚNICO Y LOCAL */
.user-icon {
  margin-bottom: 80px; /* ≈ 2 cm */
}

/* MAIN */
.main-app {
  display: flex;
  flex: 1;
  padding: 25px;
  gap: 25px;
  box-sizing: border-box;
}

.card {
  background: white;
  border-radius: 30px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.04);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}

.panel-left {
  flex: 1;
  max-width: 380px;
}

.panel-right {
  flex: 2;
  display: flex;
  flex-direction: column;
}

/* LEFT PANEL */
.header-box {
  padding: 25px;
  border-bottom: 1px solid #f0f0f0;
  font-weight: 800;
  color: var(--migo-orange);
  display: flex;
  align-items: center;
  gap: 10px;
}

.dot {
  width: 10px;
  height: 10px;
  background: #ff5252;
  border-radius: 50%;
}

#correction-log {
  padding: 25px;
  color: #666;
}

/* CHAT */
.chat-header {
  padding: 20px 30px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.chat-header h1 {
  margin: 0;
  font-weight: 800;
  font-size: 28px;
}

.chat-box {
  flex: 1;
  padding: 25px;
  overflow-y: auto;
  background-color: #fafafa;
  margin: 0 25px;
  border-radius: 25px;
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.msg {
  padding: 14px 20px;
  border-radius: 20px;
  max-width: 75%;
  font-weight: 500;
  font-size: 0.95rem;
}

.migo {
  background: var(--migo-orange);
  color: white;
  align-self: flex-start;
  border-bottom-left-radius: 4px;
}

.user {
  background: #e9ecef;
  color: #333;
  align-self: flex-end;
  border-bottom-right-radius: 4px;
}

/* INPUT */
.input-area {
  padding: 25px;
  display: flex;
  gap: 15px;
}

.input-box {
  flex: 1;
  display: flex;
  background: white;
  border: 2px solid #f0f0f0;
  border-radius: 20px;
  padding: 5px 20px;
  align-items: center;
}

#user-input {
  flex: 1;
  border: none;
  outline: none;
  padding: 12px 0;
  resize: none;
  font-family: inherit;
  font-size: 15px;
}

.btn-send {
  background: var(--migo-green);
  color: white;
  border: none;
  width: 50px;
  height: 50px;
  border-radius: 15px;
  cursor: pointer;
  font-size: 22px;
}

/* POPUPS */
.popup-migo {
  display: none;
  position: absolute;
  background: white;
  border-radius: 25px;
  padding: 20px;
  box-shadow: 0 15px 50px rgba(0,0,0,0.1);
  z-index: 100;
  border: 1px solid #eee;
}

#pop-chat-conf {
  top: 80px;
  right: 380px;
  width: 280px;
}

#pop-trans {
  top: 80px;
  right: 40px;
  width: 350px;
}

#pop-user {
  top: 140px;
  left: 100px;
  width: 200px;
}

.conf-btn {
  width: 100%;
  padding: 12px;
  margin-bottom: 8px;
  border-radius: 12px;
  border: 1px solid #eee;
  background: white;
  text-align: left;
  cursor: pointer;
  font-family: inherit;
}

.conf-btn.active {
  background: var(--migo-green);
  color: white;
}
</style>
</head>

<body>

<nav class="side-nav">
  <div class="nav-item user-icon" onclick="togglePopup('pop-user')">S</div>
</nav>

<main class="main-app">
  <div class="card panel-left">
    <div class="header-box">
      <span class="dot"></span> CORRECTIONS
    </div>
    <div id="correction-log">Waiting for phrases...</div>
  </div>

  <div class="card panel-right">
    <header class="chat-header">
      <h1>Migo<span style="color:var(--migo-orange)">.</span></h1>
      <div style="display:flex; gap:20px; font-size:22px;">
        <div style="cursor:pointer" onclick="togglePopup('pop-chat-conf')">⚙️</div>
        <div style="cursor:pointer" onclick="togglePopup('pop-trans')">🌐</div>
      </div>
    </header>

    <div class="chat-box" id="chat-box">
      <div class="msg migo">Hi! I'm Migo.</div>
    </div>

    <div class="input-area">
      <div class="input-box">
        <textarea id="user-input"></textarea>
        <button class="btn-send">➜</button>
      </div>
    </div>

    <div class="popup-migo" id="pop-chat-conf">
      <h4>Conversation mode</h4>
      <button class="conf-btn active">🔒 Strict</button>
    </div>

    <div class="popup-migo" id="pop-trans">
      <h4>Translator</h4>
      <textarea style="width:100%"></textarea>
    </div>
  </div>
</main>

<div class="popup-migo" id="pop-user">
  <h4>User</h4>
  <button class="conf-btn">Profile</button>
  <button class="conf-btn">Logout</button>
</div>

<script>
function togglePopup(id) {
  const el = document.getElementById(id);
  el.style.display = el.style.display === 'block' ? 'none' : 'block';
}
</script>

</body>
</html>
