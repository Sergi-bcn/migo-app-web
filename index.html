<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Migo Web Companion</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/main.css">
</head>
<body>

<nav class="side-nav-orange">
    <div class="nav-icons-group">
        <div class="circle-btn-nav" onclick="togglePopup('menu-modes')">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="#ffffff"><path d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.03-1.58zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/></svg>
        </div>
        <div class="profile-circle-nav" onclick="togglePopup('panel-profile-config')">S</div>
    </div>
</nav>

<main class="main-app">
    <div class="section-card corrections-panel">
        <div class="header-record-box">
            <span class="record-dot"></span>
            <span class="record-title">CORRECTIONS</span>
        </div>
        <div id="correction-log" class="log-container"></div>
        
        <div class="mini-profile-card" id="panel-profile-config" style="display:none;">
            <span class="close-x" onclick="togglePopup('panel-profile-config')">✕</span>
            <div class="avatar-large">S</div>
            <div class="user-name">Sergi Pérez</div>
            <button class="btn-reset-ui" onclick="location.reload()">Reset</button>
        </div>
    </div>

    <div class="section-card chat-main">
        <header class="chat-header">
            <h1 class="migo-title">Migo.</h1>
            <div class="header-controls">
                <button class="icon-only-btn-plain" onclick="togglePopup('panel-translator')">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="#4caf50"><path d="M12.87 15.07l-2.54-2.51.03-.03c1.74-1.94 2.98-4.17 3.71-6.53H17V4h-7V2H8v2H1v1.99h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11.76-2.04z"/></svg>
                </button>
            </div>
        </header>

        <div class="chat-box" id="chat-box"></div>

        <div class="input-area">
            <textarea id="user-input" placeholder="Type in English..." onkeydown="handleChatEnter(event)"></textarea>
            <button class="send-btn-green" onclick="sendMessage()">➜</button>
        </div>

        <div class="popup-migo translator-wide" id="panel-translator" style="display:none;">
            <span class="close-x" onclick="togglePopup('panel-translator')">✕</span>
            <textarea id="in-es" placeholder="Escribe en español..."></textarea>
            <div id="out-en" class="res-text"></div>
            <button onclick="translateNow('es','en')">Translate</button>
        </div>

        <div class="popup-migo" id="menu-modes" style="display:none;">
            <span class="close-x" onclick="togglePopup('menu-modes')">✕</span>
            <div class="opt-migo active">🔓 Relaxed</div>
            <div class="opt-migo">🔒 Strict</div>
        </div>
    </div>
</main>

<script src="js/ui-manager.js"></script>
<script src="js/chat-logic.js"></script>
</body>
</html>
