<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Migo AI - English Coach</title>
    <link rel="stylesheet" href="CSS/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <nav class="side-nav-orange">
        <div class="nav-icons-group">
            <div class="circle-btn-nav" id="menu-modes-btn" onclick="togglePopup('menu-modes')">⚙️</div>
            <div class="circle-btn-nav" onclick="togglePopup('panel-translator')">🌐</div>
            <div class="profile-circle-nav" onclick="togglePopup('user-card')">S</div>
        </div>
    </nav>

    <main class="main-app">
        <section class="section-card corrections-panel">
            <header class="header-record-box">
                <div class="record-dot"></div>
                <span class="record-title">CORRECTION LOG</span>
            </header>
            <div id="correction-log" style="padding: 25px; overflow-y: auto; flex: 1;"></div>
        </section>

        <section class="section-card chat-main">
            <header class="chat-header">
                <div class="migo-logo-container">
                    <h1 class="migo-title">Migo<span class="title-dot">.</span></h1>
                    <span class="migo-subtitle">Your English Coach</span>
                </div>
            </header>

            <div id="chat-box" class="chat-box">
                <div class="message migo">
                    <span class="msg-content">Hello! I'm Migo. Ready to practice?</span>
                </div>
            </div>

            <footer class="input-area">
                <div class="input-box">
                    <textarea id="user-input" placeholder="Type here..." onkeypress="handleChatEnter(event)"></textarea>
                    <button class="go-btn-tool-clean" onclick="sendMessage()" style="font-size: 30px; margin-left: 10px;">➔</button>
                </div>
            </footer>
        </section>
    </main>

    <div id="menu-modes" class="popup-migo">
        <span class="close-x" onclick="togglePopup('menu-modes')">×</span>
        <div class="opt-migo active">Relaxed</div>
        <div class="opt-migo">Strict</div>
    </div>

    <div id="panel-translator" class="popup-migo translator-wide">
        <span class="close-x" onclick="togglePopup('panel-translator')">×</span>
        <div class="trans-unit">
            <textarea id="in-es" placeholder="Escribe en español..." onkeypress="handleTransEnter(event, 'es', 'en')"></textarea>
            <div id="out-en" class="res-text"></div>
            <button onclick="translateNow('es', 'en')">Translate</button>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
