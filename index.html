<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Migo Web Companion</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root { --migo-orange: #ff9800; --migo-green: #4caf50; --bg: #f0f2f5; }
        body, html { margin: 0; padding: 0; height: 100vh; font-family: 'Quicksand', sans-serif; background: var(--bg); overflow: hidden; }
        
        .main-wrapper { display: flex; height: 100vh; width: 100vw; }
        
        /* Barra Lateral */
        .side-nav-orange { width: 80px; background: var(--migo-orange); display: flex; flex-direction: column; align-items: center; padding: 20px 0; gap: 20px; flex-shrink: 0; }
        .circle-btn { width: 50px; height: 50px; background: rgba(255,255,255,0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; }
        .circle-btn:hover { background: rgba(255,255,255,0.4); }
        .profile-circle { width: 50px; height: 50px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; color: var(--migo-orange); cursor: pointer; }

        /* Contenido Principal */
        .app-content { display: flex; flex: 1; padding: 20px; gap: 20px; box-sizing: border-box; }
        .card { background: white; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); display: flex; flex-direction: column; overflow: hidden; }
        .panel-left { flex: 1; max-width: 400px; }
        .panel-right { flex: 2; position: relative; }

        /* Chat */
        .chat-header { padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        .chat-box { flex: 1; padding: 20px; overflow-y: auto; background: #fafafa; margin: 0 20px; border-radius: 20px; display: flex; flex-direction: column; gap: 10px; }
        .input-area { padding: 20px; display: flex; gap: 10px; }
        textarea { flex: 1; border-radius: 15px; border: 1px solid #eee; padding: 15px; resize: none; font-family: inherit; font-size: 16px; outline: none; }
        .send-btn { background: var(--migo-green); color: white; border: none; border-radius: 15px; width: 60px; cursor: pointer; font-size: 20px; }

        /* Popups */
        .popup { display: none; position: absolute; top: 80px; right: 20px; width: 280px; background: white; border-radius: 20px; padding: 20px; box-shadow: 0 15px 50px rgba(0,0,0,0.15); z-index: 1000; }
        .close-btn { position: absolute; top: 10px; right: 15px; cursor: pointer; font-weight: bold; color: #ccc; }
    </style>

    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/main.css">
</head>
<body>

<div class="main-wrapper">
    <nav class="side-nav-orange">
        <div class="circle-btn" onclick="togglePopup('menu-modes')">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="white"><path d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.03-1.58zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/></svg>
        </div>
        <div class="profile-circle" onclick="togglePopup('panel-profile')">S</div>
    </nav>

    <div class="app-content">
        <div class="card panel-left">
            <div style="padding: 20px; border-bottom: 1px solid #eee; font-weight: 800; color: var(--migo-orange);">CORRECTIONS</div>
            <div id="correction-log" style="flex:1; padding: 20px;"></div>
        </div>

        <div class="card panel-right">
            <header class="chat-header">
                <h1 style="margin:0; font-weight: 800;">Migo.</h1>
                <div onclick="togglePopup('panel-translator')" style="cursor:pointer; font-size: 24px;">🌐</div>
            </header>

            <div class="chat-box" id="chat-box">
                <div style="background: var(--migo-orange); color: white; padding: 12px 18px; border-radius: 18px 18px 18px 0; align-self: flex-start; max-width: 80%;">
                    System Rebuilt. Can you see me now?
                </div>
            </div>

            <div class="input-area">
                <textarea id="user-input" placeholder="Escribe en inglés..." onkeydown="handleChatEnter(event)"></textarea>
                <button class="send-btn" onclick="sendMessage()">➜</button>
            </div>

            <div class="popup" id="panel-translator">
                <span class="close-btn" onclick="togglePopup('panel-translator')">✕</span>
                <h4 style="margin-top:0">Translator</h4>
                <textarea id="in-es" style="width:100%; height: 60px; margin-bottom: 10px;"></textarea>
                <button onclick="translateNow('es','en')" style="width:100%; background: var(--migo-orange); border:none; color:white; padding:10px; border-radius:10px; cursor:pointer;">Translate</button>
                <div id="out-en" style="margin-top:10px; font-weight: bold; color: #555;"></div>
            </div>

            <div class="popup" id="menu-modes">
                <span class="close-btn" onclick="togglePopup('menu-modes')">✕</span>
                <div style="padding: 10px; cursor:pointer;">🔓 Relaxed Mode</div>
                <div style="padding: 10px; cursor:pointer;">🔒 Strict Mode</div>
            </div>
        </div>
    </div>
</div>

<script src="js/ui-manager.js"></script>
<script src="js/chat-logic.js"></script>
</body>
</html>
